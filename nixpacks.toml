[phases.setup]
nixPkgs = ["nodejs_24"]

# Runs pnpm via `npx` (pinned to the exact version in the root
# package.json's `packageManager` field) instead of corepack or a global
# npm install. Corepack's bundled shim crashes on this Node build with
# ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING (a corepack/Node `vm` API
# incompatibility, unrelated to this repo), and `npm install --global`
# left `pnpm` unreachable on PATH in a later phase. `npx` resolves and
# runs the package in one self-contained step each time, sidestepping
# both problems.
[phases.install]
cmds = ["npx --yes pnpm@11.25.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@11.25.0 build"]

# Mirrors railway.json's deploy.startCommand so the image's own default
# start command never falls back to Nixpacks' `pnpm start` (pnpm isn't on
# PATH at runtime either).
[start]
cmd = "cd packages/api && node dist/index.js"
